<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tricell Imports | Atendimento</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(180deg,#101f6e 0%,#445184 45%,#f4f4f6 100%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.page{
  width:100%;
  max-width:430px;
  min-height:100vh;
  padding:35px 18px 28px;
  text-align:center;
}

.logo-area{
  width:136px;
  height:136px;
  border-radius:50%;
  margin:0 auto 50px;
  background:rgba(18,43,150,.35);
  display:flex;
  align-items:center;
  justify-content:center;
}

.logo{
  width:105px;
  max-width:105px;
}

h1{
  font-size:31px;
  font-weight:800;
  letter-spacing:.5px;
  margin-bottom:8px;
}

.subtitle{
  font-size:13px;
  font-weight:700;
  line-height:1.5;
  margin-bottom:34px;
  color:#fff;
}

.btn{
  width:100%;
  height:68px;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:0 auto 17px;
  text-decoration:none;
  color:#fff;
  font-size:17px;
  font-weight:700;
  background:rgba(255,255,255,.12);
  border:2px solid #19d85b;
  box-shadow:8px 10px 15px rgba(0,0,0,.28);
}

.btn.white{
  border-color:#fff;
  background:rgba(255,255,255,.18);
  box-shadow:8px 10px 15px rgba(0,0,0,.30);
}

.icon{
  font-size:24px;
  line-height:1;
}

.footer-space{
  height:20px;
}

@media(max-width:380px){
  .page{
    padding-left:14px;
    padding-right:14px;
  }

  h1{
    font-size:28px;
  }

  .btn{
    height:64px;
    font-size:16px;
  }
}
</style>
</head>

<body>

<main class="page">

  <div class="logo-area">
    <img src="logo.png" alt="Tricell Imports" class="logo">
  </div>

  <h1>ATENDIMENTO</h1>

  <div class="subtitle">
    📱 iPhone | 💻 Macbook | ⌚ Apple Watch | 🛠️<br>
    Assistência
  </div>

  <a class="btn btn-track" href="https://wa.me/5531999999999" target="_blank">
    <span class="icon">☏</span>
    Atendente - Wesley
  </a>

  <a class="btn btn-track" href="https://wa.me/5531999999999" target="_blank">
    <span class="icon">☏</span>
    Atendente - Lara
  </a>

  <a class="btn white btn-track" href="#" target="_blank">
    Loja física - BEATRIZ CONTAGEM
  </a>

  <div class="footer-space"></div>

</main>

<script>
function registrarClique(){
  if(typeof fbq === 'function'){
    fbq('track','Contact');
    fbq('track','Lead');
  }

  if(typeof gtag === 'function'){
    gtag('event','contact_click',{
      event_category:'WhatsApp',
      event_label:'Clique Atendimento Tricell Imports',
      value:1
    });
  }
}

document.querySelectorAll('.btn-track').forEach(function(botao){
  botao.addEventListener('click',registrarClique);
});
</script>

</body>
</html>
